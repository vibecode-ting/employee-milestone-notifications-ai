# ── docker-compose.yml ────────────────────────────────────────────────────────
# Local development: PostgreSQL + CultureOS AI App
# Usage: docker compose up -d
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cultureos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: annual_notifications
      POSTGRES_USER: cultureos
      POSTGRES_PASSWORD: cultureos_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cultureos -d annual_notifications"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── CultureOS AI App ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cultureos_app
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Database: points to the PostgreSQL container above
      DATABASE_URL: "postgresql://cultureos:cultureos_dev_pass@db:5432/annual_notifications"
      NODE_ENV: production
      PORT: 8080
      # AI credentials — copy from your .env file
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      # Email settings (optional — defaults to Ethereal Sandbox)
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Webhooks (optional)
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      APP_SECRET: ${APP_SECRET:-change_me_for_production}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist font cache and uploads across container restarts
      - app_fonts:/app/tmp/fonts
      - app_uploads:/app/tmp/uploads

volumes:
  postgres_data:
    driver: local
  app_fonts:
    driver: local
  app_uploads:
    driver: local
