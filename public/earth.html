<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAPAC 3D Earth Network</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #webgl-container:active {
      cursor: grabbing;
    }

    /* 3D Projected Country Labels Layer */
    #labels-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .country-label {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(3, 7, 18, 0.78);
      border: 1px solid rgba(125, 211, 252, 0.28);
      backdrop-filter: blur(6px);
      color: rgba(240, 246, 255, 0.9);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
      cursor: pointer;
    }

    /* Pin leader line pointing to the globe marker */
    .country-label::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 6px;
      background: rgba(56, 189, 248, 0.65);
    }

    .country-label:hover {
      background: rgba(14, 165, 233, 0.4);
      border-color: rgba(56, 189, 248, 1);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.55);
      z-index: 30;
    }

    .country-label img.flag-icon {
      width: 15px;
      height: 11px;
      object-fit: cover;
      border-radius: 2px;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    /* Active country emphasis */
    .country-label.is-active {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(56, 189, 248, 1);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.6);
      z-index: 25;
    }

    .country-label.is-active::after {
      background: rgba(56, 189, 248, 1);
      height: 9px;
      bottom: -9px;
    }

    .country-label.is-active img.flag-icon {
      width: 18px;
      height: 13px;
    }

    /* Singapore Hub anchor styling */
    .country-label.is-hub {
      border-color: rgba(52, 211, 153, 0.85);
      color: #ecfdf5;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.35);
    }

    .country-label.is-hub::after {
      background: rgba(52, 211, 153, 0.9);
      height: 8px;
      bottom: -8px;
    }

    /* De-cluttering: compact SEA pins hide text until hovered or active */
    .country-label.is-compact:not(:hover):not(.is-active) {
      padding: 3px;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      justify-content: center;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .country-label.is-compact:not(:hover):not(.is-active) .country-name {
      display: none;
    }

    .country-label.is-compact:not(:hover):not(.is-active) img.flag-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    /* Interactive hint */
    .scroll-hint {
      position: absolute;
      bottom: 20px;
      left: 24px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.25);
      backdrop-filter: blur(8px);
      color: rgba(226, 232, 240, 0.85);
      font-size: 11px;
      letter-spacing: 0.03em;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .scroll-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div id="webgl-container"></div>
  <div id="labels-layer"></div>
  <div class="scroll-hint" id="scroll-hint">
    <span class="scroll-dot"></span>
    <span>Drag to rotate • Scroll to zoom • Click country to focus</span>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================================
    // 1. JAPAC COUNTRIES & COORDINATES (Accurate Geographic Mapping)
    // =========================================================================
    const JAPAC_COUNTRIES = [
      // Primary Singapore Hub
      { code: 'sg', iso3: 'SGP', name: 'Singapore (Hub)', lat: 1.3521, lon: 103.8198, isHub: true, isKeyPin: true },
      // Southeast Asia
      { code: 'my', iso3: 'MYS', name: 'Malaysia', lat: 4.2105, lon: 101.9758, isCompact: true },
      { code: 'th', iso3: 'THA', name: 'Thailand', lat: 15.8700, lon: 100.9925, isCompact: true },
      { code: 'vn', iso3: 'VNM', name: 'Vietnam', lat: 14.0583, lon: 108.2772, isCompact: true },
      { code: 'ph', iso3: 'PHL', name: 'Philippines', lat: 12.8797, lon: 121.7740, isCompact: true },
      { code: 'id', iso3: 'IDN', name: 'Indonesia', lat: -2.5489, lon: 118.0149, isCompact: true },
      { code: 'mm', iso3: 'MMR', name: 'Myanmar', lat: 19.7633, lon: 96.0785, isKeyPin: true },
      { code: 'kh', iso3: 'KHM', name: 'Cambodia', lat: 12.5657, lon: 104.9910, isCompact: true },
      { code: 'la', iso3: 'LAO', name: 'Laos', lat: 19.8563, lon: 102.4955, isCompact: true },
      { code: 'bn', iso3: 'BRN', name: 'Brunei', lat: 4.5353, lon: 114.7277, isCompact: true },
      { code: 'tl', iso3: 'TLS', name: 'Timor-Leste', lat: -8.8742, lon: 125.7275, isCompact: true },
      // East Asia (Upper-Right)
      { code: 'jp', iso3: 'JPN', name: 'Japan', lat: 36.2048, lon: 138.2529, isKeyPin: true },
      { code: 'kr', iso3: 'KOR', name: 'South Korea', lat: 35.9078, lon: 127.7669, isKeyPin: true },
      { code: 'tw', iso3: 'TWN', name: 'Taiwan', lat: 23.6978, lon: 120.9605, isCompact: true },
      { code: 'hk', iso3: 'HKG', name: 'Hong Kong', lat: 22.3193, lon: 114.1694, isCompact: true },
      { code: 'cn', iso3: 'CHN', name: 'China', lat: 35.8617, lon: 104.1954, isKeyPin: true },
      { code: 'mn', iso3: 'MNG', name: 'Mongolia', lat: 46.8625, lon: 103.8467, isCompact: true },
      // South Asia (Upper-Left)
      { code: 'in', iso3: 'IND', name: 'India', lat: 20.5937, lon: 78.9629, isKeyPin: true },
      { code: 'bd', iso3: 'BGD', name: 'Bangladesh', lat: 23.6850, lon: 90.3563, isCompact: true },
      { code: 'lk', iso3: 'LKA', name: 'Sri Lanka', lat: 7.8731, lon: 80.7718, isCompact: true },
      { code: 'np', iso3: 'NPL', name: 'Nepal', lat: 28.3949, lon: 84.1240, isCompact: true },
      { code: 'pk', iso3: 'PAK', name: 'Pakistan', lat: 30.3753, lon: 69.3451, isCompact: true },
      // Oceania & Pacific (Bottom & East)
      { code: 'au', iso3: 'AUS', name: 'Australia', lat: -25.2744, lon: 133.7751, isKeyPin: true },
      { code: 'nz', iso3: 'NZL', name: 'New Zealand', lat: -40.9006, lon: 174.8860, isCompact: true },
      { code: 'pg', iso3: 'PNG', name: 'Papua New Guinea', lat: -6.3150, lon: 143.9555, isCompact: true },
      { code: 'fj', iso3: 'FJI', name: 'Fiji', lat: -17.7134, lon: 178.0650, isCompact: true },
      { code: 'ki', iso3: 'KIR', name: 'Kiribati', lat: 1.8709, lon: -157.3626, isCompact: true }
    ];

    // =========================================================================
    // 2. SCENE, CAMERA & RENDERER SETUP
    // =========================================================================
    const container = document.getElementById('webgl-container');
    const labelsLayer = document.getElementById('labels-layer');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 3000);
    // Explicit UP vector ensuring North is strictly +Y with zero roll
    camera.up.set(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    container.appendChild(renderer.domElement);

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    const EARTH_RADIUS = 10;

    // Geographic Lat/Lon to Cartesian Vector3 on sphere
    function latLonToVector3(lat, lon, radius = EARTH_RADIUS) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    // =========================================================================
    // 3. STELLAR STARFIELD & NEBULA
    // =========================================================================
    function createGalaxyAndStars() {
      const galaxyGroup = new THREE.Group();

      const starCount = 18000;
      const starGeo = new THREE.BufferGeometry();
      const starPos = new Float32Array(starCount * 3);
      const starCol = new Float32Array(starCount * 3);

      const palette = [
        new THREE.Color('#ffffff'),
        new THREE.Color('#dbeafe'),
        new THREE.Color('#bfdbfe'),
        new THREE.Color('#fef3c7'),
        new THREE.Color('#fed7aa'),
        new THREE.Color('#c7d2fe')
      ];

      for (let i = 0; i < starCount; i++) {
        const r = 200 + Math.random() * 800;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        starPos[i * 3 + 2] = r * Math.cos(phi);

        const c = palette[Math.floor(Math.random() * palette.length)];
        const brightness = 0.4 + Math.random() * 0.6;
        starCol[i * 3] = c.r * brightness;
        starCol[i * 3 + 1] = c.g * brightness;
        starCol[i * 3 + 2] = c.b * brightness;
      }

      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));

      const starMat = new THREE.PointsMaterial({
        size: 1.2,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
      });
      galaxyGroup.add(new THREE.Points(starGeo, starMat));

      scene.add(galaxyGroup);
      return { group: galaxyGroup, starMat };
    }

    const galaxyData = createGalaxyAndStars();
    const galaxyField = galaxyData.group;
    const starMatRef = galaxyData.starMat;

    // =========================================================================
    // 4. ORBITAL SUNBURST & VOLUMETRIC RAYS (SUNRISE / SUNSET)
    // =========================================================================
    let currentTheme = 'dark';
    let themeProgress = 0.0; // 0.0 = dark night space, 1.0 = radiant golden sunrise

    function createSunAndBeams() {
      const sunGroup = new THREE.Group();

      // Sun radial corona canvas
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 12, 256, 256, 256);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.18, 'rgba(254, 240, 138, 0.95)');
      grad.addColorStop(0.42, 'rgba(251, 146, 60, 0.6)');
      grad.addColorStop(0.72, 'rgba(234, 88, 12, 0.22)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      const sunTexture = new THREE.CanvasTexture(canvas);
      const sunCoronaMat = new THREE.SpriteMaterial({
        map: sunTexture,
        color: 0xffffff,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const sunCorona = new THREE.Sprite(sunCoronaMat);
      sunCorona.scale.set(48, 48, 1);
      sunGroup.add(sunCorona);

      // Volumetric Sun Rays Fan
      const beamGroup = new THREE.Group();
      const beamCount = 18;
      const beamGeo = new THREE.PlaneGeometry(4.5, 56);
      beamGeo.translate(0, 28, 0);

      const beamCanvas = document.createElement('canvas');
      beamCanvas.width = 128;
      beamCanvas.height = 512;
      const bCtx = beamCanvas.getContext('2d');
      const bGrad = bCtx.createLinearGradient(0, 0, 0, 512);
      bGrad.addColorStop(0.0, 'rgba(255, 252, 235, 0.85)');
      bGrad.addColorStop(0.22, 'rgba(253, 224, 71, 0.5)');
      bGrad.addColorStop(0.6, 'rgba(249, 115, 22, 0.18)');
      bGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      bCtx.fillStyle = bGrad;
      bCtx.fillRect(0, 0, 128, 512);

      const beamTex = new THREE.CanvasTexture(beamCanvas);
      const beamMat = new THREE.MeshBasicMaterial({
        map: beamTex,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      for (let b = 0; b < beamCount; b++) {
        const angle = (b / beamCount) * Math.PI * 2;
        const beam = new THREE.Mesh(beamGeo, beamMat);
        beam.rotation.z = angle;
        const s = 0.75 + (b % 4) * 0.28;
        beam.scale.set(s, s * 1.15, 1);
        beamGroup.add(beam);
      }
      sunGroup.add(beamGroup);

      // Position sun over Earth's upper-right horizon
      sunGroup.position.set(17, 13, -22);
      scene.add(sunGroup);

      return {
        group: sunGroup,
        coronaMat: sunCoronaMat,
        beamMat,
        beamGroup
      };
    }

    const sunBeams = createSunAndBeams();

    // =========================================================================
    // 5. LIGHTING ARRAYS & EARTH MESH
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0x475569, 0.85);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5eb, 1.35);
    sunLight.position.set(32, 20, 36);
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.6);
    rimLight.position.set(-35, -15, -25);
    scene.add(rimLight);

    const cameraLight = new THREE.DirectionalLight(0x93c5fd, 0.65);
    cameraLight.position.set(0, 0, 1);
    camera.add(cameraLight);
    scene.add(camera);

    const textureLoader = new THREE.TextureLoader();
    const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);
    const earthMat = new THREE.MeshPhongMaterial({
      color: new THREE.Color(0xffffff),
      specular: new THREE.Color(0x223344),
      shininess: 15
    });

    textureLoader.load(
      'https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg',
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        earthMat.map = tex;
        earthMat.needsUpdate = true;
      }
    );

    textureLoader.load(
      'https://unpkg.com/three-globe@2.31.0/example/img/earth-night.jpg',
      (nightTex) => {
        nightTex.colorSpace = THREE.SRGBColorSpace;
        earthMat.emissiveMap = nightTex;
        earthMat.emissive = new THREE.Color(0xffffff);
        earthMat.emissiveIntensity = 0.85;
        earthMat.needsUpdate = true;
      }
    );

    textureLoader.load(
      'https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png',
      (bump) => {
        earthMat.bumpMap = bump;
        earthMat.bumpScale = 0.12;
        earthMat.needsUpdate = true;
      }
    );

    const earthMesh = new THREE.Mesh(earthGeo, earthMat);
    worldGroup.add(earthMesh);

    // Realistic Atmospheric Back-Light Shader (Sun-Scattering Rim)
    const atmosGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.024, 96, 96);
    const atmosMat = new THREE.ShaderMaterial({
      uniforms: {
        uSunrise: { value: 0.0 },
        uSunPos: { value: new THREE.Vector3(17, 13, -22) }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPosition = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vPosition;
        uniform float uSunrise;
        uniform vec3 uSunPos;

        void main() {
          float rim = 1.0 - max(0.0, dot(vNormal, vec3(0.0, 0.0, 1.0)));
          float intensity = pow(rim, 2.8);

          // Cool sapphire space glow during night
          vec3 nightColor = vec3(0.2, 0.62, 0.98) * intensity * 0.72;

          // Warm golden-amber atmospheric sunrise scatter toward sun position
          vec3 sunDir = normalize(uSunPos);
          float sunDot = max(0.0, dot(normalize(vPosition), sunDir));
          float sunScatter = pow(sunDot, 3.0) * 1.5;
          vec3 sunriseColor = mix(vec3(0.96, 0.6, 0.18), vec3(1.0, 0.95, 0.85), sunDot) * (intensity * 1.35 + sunScatter);

          vec3 finalColor = mix(nightColor, sunriseColor, uSunrise);
          float finalAlpha = mix(intensity * 0.82, (intensity + sunScatter * 0.4) * 0.92, uSunrise);

          gl_FragColor = vec4(finalColor, finalAlpha);
        }
      `,
      blending: THREE.AdditiveBlending,
      side: THREE.BackSide,
      transparent: true,
      depthWrite: false
    });
    scene.add(new THREE.Mesh(atmosGeo, atmosMat));

    // =========================================================================
    // 6. JAPAC NETWORK ARCS, PARTICLES & DE-CLUTTERED LABELS
    // =========================================================================
    const singaporeHub = JAPAC_COUNTRIES[0];
    const sgPos = latLonToVector3(singaporeHub.lat, singaporeHub.lon, EARTH_RADIUS + 0.03);

    const countryVisuals = new Map();
    const animatedPulses = [];

    JAPAC_COUNTRIES.forEach((country, idx) => {
      const pos = latLonToVector3(country.lat, country.lon, EARTH_RADIUS + 0.03);

      const markerGeo = new THREE.SphereGeometry(country.isHub ? 0.12 : 0.065, 16, 16);
      const markerMat = new THREE.MeshBasicMaterial({
        color: country.isHub ? 0x34d399 : (country.code === 'mm' ? 0xfbbf24 : 0x38bdf8),
        transparent: true,
        opacity: 0.9
      });
      const marker = new THREE.Mesh(markerGeo, markerMat);
      marker.position.copy(pos);
      worldGroup.add(marker);

      let arcMat = null;
      if (!country.isHub) {
        // Build elevated Great-Circle 3D flight trajectory from country to Singapore hub
        const u1 = pos.clone().normalize();
        const u2 = sgPos.clone().normalize();
        const angularDist = u1.angleTo(u2);

        const pointsCount = 64;
        const arcPoints = [];
        const peakAltitude = Math.min(4.8, Math.max(1.4, angularDist * 1.8));

        const dot = Math.max(-1, Math.min(1, u1.dot(u2)));
        const theta = Math.acos(dot);

        for (let i = 0; i <= pointsCount; i++) {
          const t = i / pointsCount;
          const alt = 0.04 + Math.sin(t * Math.PI) * peakAltitude;

          let slerpedPt;
          if (theta < 0.0001) {
            slerpedPt = u1.clone();
          } else {
            const sinTheta = Math.sin(theta);
            const a = Math.sin((1 - t) * theta) / sinTheta;
            const b = Math.sin(t * theta) / sinTheta;
            slerpedPt = new THREE.Vector3(
              a * u1.x + b * u2.x,
              a * u1.y + b * u2.y,
              a * u1.z + b * u2.z
            ).normalize();
          }
          arcPoints.push(slerpedPt.multiplyScalar(EARTH_RADIUS + alt));
        }

        const curve = new THREE.CatmullRomCurve3(arcPoints);
        const arcGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(80));

        arcMat = new THREE.LineBasicMaterial({
          color: country.code === 'mm' ? 0xfbbf24 : 0x38bdf8,
          transparent: true,
          opacity: 0.35,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const arcLine = new THREE.Line(arcGeo, arcMat);
        worldGroup.add(arcLine);

        // Travelling glowing packet pulse
        const pulseGeo = new THREE.SphereGeometry(0.08, 12, 12);
        const pulseMat = new THREE.MeshBasicMaterial({
          color: country.code === 'mm' ? 0xfde047 : 0x7dd3fc,
          transparent: true,
          opacity: 0.95
        });
        const pulseMesh = new THREE.Mesh(pulseGeo, pulseMat);
        worldGroup.add(pulseMesh);

        animatedPulses.push({
          curve,
          mesh: pulseMesh,
          mat: pulseMat,
          speed: 0.2 + (idx % 6) * 0.035,
          offset: (idx * 0.11) % 1,
          code: country.code
        });
      }

      // Label DOM Element
      const labelEl = document.createElement('div');
      labelEl.className = 'country-label' +
        (country.isHub ? ' is-hub' : '') +
        (country.isCompact ? ' is-compact' : '');
      labelEl.style.pointerEvents = 'auto';
      labelEl.style.cursor = 'pointer';
      labelEl.title = `Focus on ${country.name}`;

      labelEl.addEventListener('click', (e) => {
        e.stopPropagation();
        notifyInteraction(true);
        applySlide(idx + 1);
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'SELECT_COUNTRY',
              code: country.code,
              name: country.name
            }, '*');
          }
        } catch (err) {}
      });

      labelEl.addEventListener('mouseenter', () => {
        notifyInteraction(true);
      });

      const flagImg = document.createElement('img');
      flagImg.className = 'flag-icon';
      flagImg.src = `https://flagcdn.com/w40/${country.code}.png`;
      flagImg.alt = country.name;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'country-name';
      nameSpan.textContent = country.name;

      labelEl.appendChild(flagImg);
      labelEl.appendChild(nameSpan);
      labelsLayer.appendChild(labelEl);

      countryVisuals.set(country.code, {
        data: country,
        pos3D: pos,
        markerMat,
        arcMat,
        labelEl
      });
    });

    // =========================================================================
    // 7. RIGOROUS ROTATION & ALIGNMENT (Euler YXZ - North Strictly UP)
    // =========================================================================
    let currentSlideIndex = 0;
    const totalSlides = JAPAC_COUNTRIES.length + 1;

    let targetCameraZ = 34.0;
    let currentCameraZ = 34.0;

    let targetYaw = - (110.0 + 90) * (Math.PI / 180);
    let currentYaw = targetYaw;
    let targetPitch = 12.0 * (Math.PI / 180);
    let currentPitch = targetPitch;

    const targetQuaternion = new THREE.Quaternion();
    const currentQuaternion = new THREE.Quaternion();

    function computeRotationForLatLon(lat, lon) {
      const euler = new THREE.Euler(
        lat * (Math.PI / 180),
        - (lon + 90) * (Math.PI / 180),
        0,
        'YXZ'
      );
      return new THREE.Quaternion().setFromEuler(euler);
    }

    let interactionNotifyTimeout = null;
    let lastInteractionReportTime = 0;

    function notifyInteraction(active = true) {
      const now = performance.now();
      const hint = document.getElementById('scroll-hint');
      if (hint) {
        hint.style.opacity = active ? '0.3' : '0.85';
      }

      if (active && now - lastInteractionReportTime < 60) return;
      lastInteractionReportTime = now;

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'EARTH_INTERACTION',
            isInteracting: active,
            timestamp: Date.now()
          }, '*');
        }
      } catch (err) {}

      clearTimeout(interactionNotifyTimeout);
      if (active) {
        interactionNotifyTimeout = setTimeout(() => {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'EARTH_INTERACTION',
                isInteracting: false,
                timestamp: Date.now()
              }, '*');
            }
          } catch (err) {}
          if (hint) hint.style.opacity = '0.75';
        }, 12000);
      }
    }

    function applySlide(slideIndex) {
      currentSlideIndex = ((slideIndex % totalSlides) + totalSlides) % totalSlides;

      if (currentSlideIndex === 0) {
        targetCameraZ = 34.0;
        targetPitch = 12.0 * (Math.PI / 180);
        targetYaw = - (110.0 + 90) * (Math.PI / 180);
        targetQuaternion.copy(computeRotationForLatLon(12.0, 110.0));
      } else {
        const activeCountry = JAPAC_COUNTRIES[currentSlideIndex - 1];
        targetCameraZ = 22.0;
        targetPitch = activeCountry.lat * (Math.PI / 180);
        targetYaw = - (activeCountry.lon + 90) * (Math.PI / 180);
        targetQuaternion.copy(computeRotationForLatLon(activeCountry.lat, activeCountry.lon));
      }

      const activeCode = currentSlideIndex === 0
        ? null
        : JAPAC_COUNTRIES[currentSlideIndex - 1].code;

      countryVisuals.forEach((vis, code) => {
        const isCurrent = code === activeCode;
        const isOverview = activeCode === null;

        vis.labelEl.classList.toggle('is-active', isCurrent);

        if (vis.arcMat) {
          vis.arcMat.opacity = isOverview ? 0.35 : (isCurrent ? 0.95 : 0.12);
        }
      });
    }

    applySlide(0);
    currentQuaternion.copy(targetQuaternion);
    worldGroup.quaternion.copy(currentQuaternion);
    camera.position.set(0, 0, currentCameraZ);

    // Mouse drag interaction (Maintains North strictly UP, clamps pitch)
    let mouseStartX = null;
    let mouseStartY = null;
    let isMouseDown = false;

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
      container.style.cursor = 'grabbing';
      notifyInteraction(true);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown || mouseStartX === null) return;
      notifyInteraction(true);
      const dx = e.clientX - mouseStartX;
      const dy = e.clientY - mouseStartY;

      targetYaw += dx * 0.005;
      targetPitch = Math.max(-1.3, Math.min(1.3, targetPitch + dy * 0.005));
      targetQuaternion.setFromEuler(new THREE.Euler(targetPitch, targetYaw, 0, 'YXZ'));

      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      mouseStartX = null;
      mouseStartY = null;
      container.style.cursor = 'grab';
    });

    window.addEventListener('mouseleave', () => {
      isMouseDown = false;
      mouseStartX = null;
      mouseStartY = null;
      container.style.cursor = 'grab';
    });

    // Mouse wheel: Smooth zoom control
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      notifyInteraction(true);
      const zoomDelta = e.deltaY * 0.025;
      targetCameraZ = Math.max(18, Math.min(48, targetCameraZ + zoomDelta));
    }, { passive: false });

    // Double-click resets view to JAPAC overview
    window.addEventListener('dblclick', () => {
      notifyInteraction(true);
      applySlide(0);
    });

    // Touch swipe & pinch zoom for mobile
    let touchStartX = null;
    let touchStartY = null;
    window.addEventListener('touchstart', (e) => {
      notifyInteraction(true);
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      notifyInteraction(true);
      if (e.touches.length === 1 && touchStartX !== null) {
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        targetYaw += dx * 0.0045;
        targetPitch = Math.max(-1.3, Math.min(1.3, targetPitch + dy * 0.0045));
        targetQuaternion.setFromEuler(new THREE.Euler(targetPitch, targetYaw, 0, 'YXZ'));
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      touchStartX = null;
      touchStartY = null;
    }, { passive: true });

    // =========================================================================
    // 8. RENDER LOOP
    // =========================================================================
    const tempWorldVec = new THREE.Vector3();
    const tempNormalVec = new THREE.Vector3();
    const cameraDirVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      currentQuaternion.slerp(targetQuaternion, 0.065);
      worldGroup.quaternion.copy(currentQuaternion);

      currentCameraZ += (targetCameraZ - currentCameraZ) * 0.065;
      camera.position.z = currentCameraZ;

      galaxyField.rotation.y += 0.00015;

      const activeCode = currentSlideIndex === 0
        ? null
        : JAPAC_COUNTRIES[currentSlideIndex - 1].code;

      // Update travelling pulses
      for (let i = 0; i < animatedPulses.length; i++) {
        const p = animatedPulses[i];
        p.offset = (p.offset + p.speed * 0.008) % 1;
        const pt = p.curve.getPoint(p.offset);
        p.mesh.position.copy(pt);
        p.mat.opacity = (activeCode === null || activeCode === p.code) ? 0.95 : 0.18;
      }

      // Update 3D label positions & visibility
      const halfW = (container.clientWidth || window.innerWidth) * 0.5;
      const halfH = (container.clientHeight || window.innerHeight) * 0.5;
      cameraDirVec.copy(camera.position).normalize();

      countryVisuals.forEach((vis, code) => {
        tempWorldVec.copy(vis.pos3D).applyQuaternion(worldGroup.quaternion);
        tempNormalVec.copy(tempWorldVec).normalize();

        const facingDot = tempNormalVec.dot(cameraDirVec);
        const isActive = code === activeCode;

        if (facingDot > 0.22) {
          tempWorldVec.project(camera);
          const screenX = (tempWorldVec.x * halfW) + halfW;
          const screenY = -(tempWorldVec.y * halfH) + halfH;

          vis.labelEl.style.transform = `translate(-50%, -100%) translate3d(${screenX.toFixed(1)}px, ${screenY.toFixed(1)}px, 0)`;

          if (activeCode === null) {
            vis.labelEl.style.opacity = Math.min(0.9, (facingDot - 0.22) * 1.6).toFixed(2);
          } else {
            vis.labelEl.style.opacity = isActive ? '1' : (vis.data.isHub ? '0.85' : '0.3');
          }
        } else {
          vis.labelEl.style.opacity = '0';
        }
      });

      // Smooth Sunrise & Sunset Transition Engine
      const targetThemeVal = currentTheme === 'light' ? 1.0 : 0.0;
      themeProgress += (targetThemeVal - themeProgress) * 0.045;

      // Atmospheric shader sunrise uniform
      atmosMat.uniforms.uSunrise.value = themeProgress;

      // Stars fade out on sunrise, reappear in dark space
      if (starMatRef) {
        starMatRef.opacity = Math.max(0.0, (1.0 - themeProgress) * 0.9);
      }

      // Sun beams and corona brighten during sunrise
      if (sunBeams) {
        sunBeams.coronaMat.opacity = themeProgress * 0.95;
        sunBeams.beamMat.opacity = themeProgress * 0.75;
        sunBeams.beamGroup.rotation.z += 0.0018;

        sunLight.intensity = 1.35 + themeProgress * 1.4;
        ambientLight.intensity = 0.85 + themeProgress * 0.65;

        // Dynamic background tint transition
        const bgR = (2 + themeProgress * 16) / 255;
        const bgG = (6 + themeProgress * 30) / 255;
        const bgB = (23 + themeProgress * 55) / 255;
        renderer.setClearColor(new THREE.Color(bgR, bgG, bgB), 1);
      }

      // City night lights glow in dark mode, wash out in daylight
      if (earthMat.emissiveMap) {
        earthMat.emissiveIntensity = Math.max(0.0, (1.0 - themeProgress) * 0.9);
      }

      renderer.render(scene, camera);
    }

    animate();

    // Listen for theme and slide messages from parent window
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'SET_THEME') {
        currentTheme = event.data.theme === 'light' ? 'light' : 'dark';
      }
      if (event.data.type === 'SET_SLIDE') {
        applySlide(event.data.slideIndex);
      }
      if (event.data.type === 'SELECT_COUNTRY' && event.data.code) {
        const targetIdx = JAPAC_COUNTRIES.findIndex((c) => c.code === event.data.code);
        if (targetIdx !== -1) {
          applySlide(targetIdx + 1);
        }
      }
    });

    function onResize() {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);
  </script>
</body>
</html>
